name: Build container (PR)
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          set -euo pipefail
          # nullglob: a pattern that matches nothing (e.g. hosts/*.sh) must
          # drop out instead of being passed to shellcheck as a literal.
          shopt -s nullglob
          files=(*.sh hosts/*.sh tests/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No shell scripts found to check"
            exit 1
          fi
          shellcheck -x "${files[@]}"

      - name: docker compose config
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config -q

      - name: tests
        run: |
          set -euo pipefail
          for t in tests/*.sh; do
            # image-smoke.sh needs a built image; it runs in the build job.
            [ "$(basename "$t")" = image-smoke.sh ] && continue
            bash "$t"
          done

  matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate matrix from matrix.json
        id: generate
        run: |
          set -euo pipefail
          # PR builds deliberately cover less than deploy.yml: the full
          # java x node x arch product is far more than a dependency bump
          # needs. Instead we cover every JDK against the default Node, every
          # Node against the default JDK, and add a single arm64 build of the
          # default pair so arch-specific breakage (e.g. the TARGETARCH-derived
          # JAVA_HOME) is still caught before merge. The amd64 default pair
          # also gets the image smoke test (smoke: true).
          MATRIX=$(jq -c '
            .default_jdk as $dj | .default_node as $dn
            | ( [ .java_versions[] | {java_version: ., node_version: $dn} ]
                + [ .node_versions[] | {java_version: $dj, node_version: .} ]
                | unique ) as $combos
            | { include:
                ( [ $combos[] | . + {platform: "linux/amd64", arch: "amd64", runner: "ubuntu-latest",
                                     smoke: (.java_version == $dj and .node_version == $dn)} ]
                  + [ {java_version: $dj, node_version: $dn,
                       platform: "linux/arm64", arch: "arm64", runner: "ubuntu-24.04-arm", smoke: false} ] ) }' matrix.json)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} JDK ${{ matrix.java_version }} Node ${{ matrix.node_version }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract versions from Dockerfile
        id: versions
        run: |
          set -euo pipefail
          # Only VERSION is extracted here: JDK and Node come from the matrix,
          # and the SDK args are consumed straight from the Dockerfile defaults
          # since nothing in a PR build needs them for tagging.
          RUNNER_TAG=$(grep -m1 '^ARG VERSION=' Dockerfile | cut -d= -f2)

          if [ -z "$RUNNER_TAG" ]; then
            echo "::error::Failed to extract versions from Dockerfile"
            exit 1
          fi

          echo "runner_tag=${RUNNER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Layer cache lives in the GitHub Actions cache, one scope per platform so
      # the amd64 and arm64 legs never overwrite each other. PR builds read and
      # write it too; branch scoping keeps a PR from polluting main's cache.
      # `load` is only set on the smoke leg: the other legs have nothing to run.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.smoke }}
          tags: github-runner:smoke
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.versions.outputs.runner_tag }}
            JAVA_VERSION=${{ matrix.java_version }}
            NODE_VERSION=${{ matrix.node_version }}
            RUNNER_IMAGE_TAG=pr-${{ github.event.pull_request.number }}
            RUNNER_IMAGE_REVISION=${{ github.event.pull_request.head.sha }}

      - name: Smoke test image
        if: matrix.smoke
        run: bash tests/image-smoke.sh github-runner:smoke "${{ matrix.java_version }}" "${{ matrix.node_version }}"

  gate:
    name: All builds passed
    needs: [scripts, matrix, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that all required jobs succeeded
        run: |
          if [ "${{ needs.scripts.result }}" != "success" ] || [ "${{ needs.matrix.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::A required job failed or was cancelled (scripts: ${{ needs.scripts.result }}, matrix: ${{ needs.matrix.result }}, build: ${{ needs.build.result }})"
            exit 1
          fi
          echo "All builds succeeded"
