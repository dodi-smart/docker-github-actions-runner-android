name: Build container (PR)
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          set -euo pipefail
          # nullglob: a pattern that matches nothing (e.g. hosts/*.sh) must
          # drop out instead of being passed to shellcheck as a literal.
          shopt -s nullglob
          files=(*.sh hosts/*.sh tests/*.sh tests/bench/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No shell scripts found to check"
            exit 1
          fi
          shellcheck -x "${files[@]}"

      - name: docker compose config
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config -q

      - name: tests
        run: |
          set -euo pipefail
          for t in tests/*.sh; do
            # image-smoke.sh needs a built image; it runs in the build job.
            [ "$(basename "$t")" = image-smoke.sh ] && continue
            bash "$t"
          done

  matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      runner_tag: ${{ steps.versions.outputs.runner_tag }}
    steps:
      - uses: actions/checkout@v7

      # Only VERSION is needed here: JDK and Node come from the matrix, and the
      # SDK args are consumed straight from the Dockerfile defaults since
      # nothing in a PR build needs them for tagging.
      - name: Extract versions from Dockerfile
        id: versions
        run: |
          set -euo pipefail
          RUNNER_TAG=$(grep -m1 '^ARG VERSION=' Dockerfile | cut -d= -f2)

          if [ -z "$RUNNER_TAG" ]; then
            echo "::error::Failed to extract versions from Dockerfile"
            exit 1
          fi

          echo "runner_tag=${RUNNER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate matrix from matrix.json
        id: generate
        run: |
          set -euo pipefail
          # PR builds deliberately cover less than deploy.yml: the full
          # java x node x arch product is far more than a dependency bump
          # needs. Instead we cover every JDK against the default Node, every
          # Node against the default JDK, and add a single arm64 build of the
          # default pair so arch-specific breakage (e.g. the TARGETARCH-derived
          # JAVA_HOME) is still caught before merge. The amd64 default pair
          # also gets the image smoke test (smoke: true), and the opt-in
          # runner-ndk and runner-slim targets get one amd64 build + smoke test
          # each, since deploy.yml publishes them.
          # The variants/legs table is shared with deploy.yml (.github/jq/matrix.jq).
          MATRIX=$(jq -c -L .github/jq '
            include "matrix";
            .default_jdk as $dj | .default_node as $dn
            | ( [ .java_versions[] | {java_version: ., node_version: $dn} ]
                + [ .node_versions[] | {java_version: $dj, node_version: .} ]
                | unique ) as $combos
            | { include:
                ( [ $combos[] | leg(.java_version; .node_version; "std"; "amd64")
                    + {smoke: (.java_version == $dj and .node_version == $dn)} ]
                  + [ leg($dj; $dn; "std"; "arm64") + {smoke: false} ]
                  + [ leg($dj; $dn; "ndk"; "amd64") + {smoke: true} ]
                  + [ leg($dj; $dn; "slim"; "amd64") + {smoke: true} ] ) }' matrix.json)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} JDK ${{ matrix.java_version }} Node ${{ matrix.node_version }} (${{ matrix.variant }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Layer cache lives in the GitHub Actions cache, one scope per platform (and
      # per ndk/slim variant, matching deploy.yml) so
      # the amd64 and arm64 legs never overwrite each other. PR builds read and
      # write it too; branch scoping keeps a PR from polluting main's cache.
      # `load` is only set on the smoke leg: the other legs have nothing to run.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.smoke }}
          tags: github-runner:smoke-${{ matrix.variant }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}
            ${{ matrix.cache_scope != matrix.arch && format('type=gha,scope={0}', matrix.cache_scope) || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          build-args: |
            VERSION=${{ needs.matrix.outputs.runner_tag }}
            JAVA_VERSION=${{ matrix.java_version }}
            NODE_VERSION=${{ matrix.node_version }}
            RUNNER_IMAGE_TAG=pr-${{ github.event.pull_request.number }}
            RUNNER_IMAGE_REVISION=${{ github.event.pull_request.head.sha }}

      - name: Smoke test image
        if: matrix.smoke
        run: bash tests/image-smoke.sh github-runner:smoke-${{ matrix.variant }} "${{ matrix.java_version }}" "${{ matrix.node_version }}" "${{ matrix.variant }}"

  gate:
    name: All builds passed
    needs: [scripts, matrix, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that all required jobs succeeded
        run: |
          if [ "${{ needs.scripts.result }}" != "success" ] || [ "${{ needs.matrix.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::A required job failed or was cancelled (scripts: ${{ needs.scripts.result }}, matrix: ${{ needs.matrix.result }}, build: ${{ needs.build.result }})"
            exit 1
          fi
          echo "All builds succeeded"
