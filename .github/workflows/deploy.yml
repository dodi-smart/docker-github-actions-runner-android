name: Deploy container
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_matrix: ${{ steps.generate.outputs.build_matrix }}
      merge_matrix: ${{ steps.generate.outputs.merge_matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate matrices from matrix.json
        id: generate
        run: |
          set -euo pipefail
          # Every JDK x Node pair is published as the `runner` target. The
          # default pair is additionally published as `runner-ndk` (the same
          # image plus the NDK); it is a separate "variant" so its digests,
          # cache scope and tags never mix with the standard image.
          ALL=$(jq -c '
            .default_jdk as $dj | .default_node as $dn
            | [ .java_versions[] as $j | .node_versions[] as $n |
                { java_version: $j, node_version: $n,
                  is_default_jdk:  ($j == $dj),
                  is_default_node: ($n == $dn),
                  variant: "std", target: "runner", ndk: false, tag_suffix: "" } ] as $std
            | ( [ $std[] | select(.is_default_jdk and .is_default_node)
                  | . + {variant: "ndk", target: "runner-ndk", ndk: true, tag_suffix: "-ndk"} ] ) as $ndk
            | ( $std + $ndk ) as $combos
            | { build: { include: [
                  $combos[] as $c |
                  ($c + {platform: "linux/amd64", arch: "amd64", runner: "ubuntu-latest",
                         cache_scope: (if $c.ndk then "ndk-amd64" else "amd64" end)}),
                  ($c + {platform: "linux/arm64", arch: "arm64", runner: "ubuntu-24.04-arm",
                         cache_scope: (if $c.ndk then "ndk-arm64" else "arm64" end)}) ] },
                merge: { include: $combos } }' matrix.json)
          echo "build_matrix=$(jq -c .build  <<< "$ALL")" >> "$GITHUB_OUTPUT"
          echo "merge_matrix=$(jq -c .merge <<< "$ALL")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} JDK ${{ matrix.java_version }} Node ${{ matrix.node_version }}${{ matrix.tag_suffix }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract versions from Dockerfile
        id: versions
        run: |
          set -euo pipefail
          RUNNER_TAG=$(grep -m1 '^ARG VERSION=' Dockerfile | cut -d= -f2)
          RUNNER_VERSION=$(echo "$RUNNER_TAG" | cut -d- -f1)
          COMPILE_SDK=$(grep -m1 '^ARG COMPILE_SDK=' Dockerfile | cut -d= -f2)

          if [ -z "$RUNNER_TAG" ] || [ -z "$RUNNER_VERSION" ] || [ -z "$COMPILE_SDK" ]; then
            echo "::error::Failed to extract versions from Dockerfile"
            exit 1
          fi

          {
            echo "runner_tag=${RUNNER_TAG}"
            echo "runner_version=${RUNNER_VERSION}"
            echo "compile_sdk=${COMPILE_SDK}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Image identity baked into the image as RUNNER_IMAGE_TAG /
      # RUNNER_IMAGE_REVISION (Dockerfile ARG -> ENV). The tag is the fully
      # pinned one, which never changes meaning; the revision is the commit.
      - name: Docker metadata (image identity)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/github-runner
          tags: |
            type=raw,value=${{ steps.versions.outputs.runner_version }}-jdk${{ matrix.java_version }}-sdk${{ steps.versions.outputs.compile_sdk }}-node${{ matrix.node_version }}${{ matrix.tag_suffix }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          # Layer cache in the GitHub Actions cache, one scope per platform
          # (the NDK variant keeps its own scope and reads the standard one).
          cache-from: |
            type=gha,scope=${{ matrix.arch }}
            type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          # Disable SLSA provenance: it wraps the image in a per-registry
          # attestation index which produces unknown/unknown manifest entries
          # and an extra attestation manifest per arch. Nothing in this
          # pipeline consumes the provenance, and turning it off keeps the
          # registry view to just amd64 + arm64.
          provenance: false
          build-args: |
            VERSION=${{ steps.versions.outputs.runner_tag }}
            JAVA_VERSION=${{ matrix.java_version }}
            NODE_VERSION=${{ matrix.node_version }}
            RUNNER_IMAGE_TAG=${{ steps.meta.outputs.version }}
            RUNNER_IMAGE_REVISION=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/github-runner,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-jdk${{ matrix.java_version }}-node${{ matrix.node_version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge JDK ${{ matrix.java_version }} Node ${{ matrix.node_version }}${{ matrix.tag_suffix }}
    needs: [matrix, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.merge_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract versions from Dockerfile
        id: versions
        run: |
          set -euo pipefail
          RUNNER_TAG=$(grep -m1 '^ARG VERSION=' Dockerfile | cut -d= -f2)
          RUNNER_VERSION=$(echo "$RUNNER_TAG" | cut -d- -f1)
          COMPILE_SDK=$(grep -m1 '^ARG COMPILE_SDK=' Dockerfile | cut -d= -f2)

          if [ -z "$RUNNER_TAG" ] || [ -z "$RUNNER_VERSION" ] || [ -z "$COMPILE_SDK" ]; then
            echo "::error::Failed to extract versions from Dockerfile"
            exit 1
          fi

          echo "runner_version=${RUNNER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "compile_sdk=${COMPILE_SDK}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.variant }}-jdk${{ matrix.java_version }}-node${{ matrix.node_version }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/github-runner
          tags: |
            type=raw,value=jdk${{ matrix.java_version }},enable=${{ !matrix.ndk && matrix.is_default_node }}
            type=raw,value=node${{ matrix.node_version }},enable=${{ !matrix.ndk && matrix.is_default_jdk }}
            type=raw,value=jdk${{ matrix.java_version }}-node${{ matrix.node_version }},enable=${{ !matrix.ndk }}
            type=raw,value=${{ steps.versions.outputs.runner_version }}-jdk${{ matrix.java_version }}-sdk${{ steps.versions.outputs.compile_sdk }}-node${{ matrix.node_version }}${{ matrix.tag_suffix }}
            type=raw,value=latest,enable=${{ !matrix.ndk && matrix.is_default_jdk && matrix.is_default_node }}
            type=raw,value=ndk,enable=${{ matrix.ndk }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/github-runner
        run: |
          set -euo pipefail
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # Source: one per arch, by digest, from the GHCR push in the build job.
          SOURCES=$(printf "${IMAGE}@sha256:%s " *)
          # TAGS and SOURCES are deliberately word-split into arguments.
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGS $SOURCES

          for tag in $(jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools inspect "$tag"
          done
