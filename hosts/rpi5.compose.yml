# Layer on top of docker-compose.yml for the ARM64 rpi5 hosts:
#
#   docker compose -f docker-compose.yml -f hosts/rpi5.compose.yml up -d
#
# hosts/rpi5.env.example sets COMPOSE_FILE so a plain `docker compose ...`
# does exactly that. The rpi5 pool is the agent/utility pool: it must not
# mount the heavy X64 cache volumes (bun, npm, pnpm, gradle, cargo, rustup,
# konan, mise, hk) - those runners isolate to RUNNER_TEMP and the SD/NVMe is
# small. Each runner keeps only docker.sock and its work volume, and the
# pruner (which only caps cache volumes) does docker pruning alone.
# `!override` replaces the base volume lists instead of merging into them.
services:
  runner:
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/tmp/runner/work
  runner-2:
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work-2:/tmp/runner/work
  runner-3:
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work-3:/tmp/runner/work
  pruner:
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
